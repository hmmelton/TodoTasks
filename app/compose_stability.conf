// Types the Compose compiler treats as stable, wired in through composeCompiler in
// build.gradle.kts.

// The UI state types are immutable in practice. Their task lists come from Room or the ViewModel,
// which replaces them rather than mutating them, so composables can skip by equality. List itself
// isn't declared stable, since other lists may be mutable.
com.harrison.todotasks.ui.tasks.TaskListUiState
com.harrison.todotasks.ui.tasks.TaskListUiState.*
com.harrison.todotasks.ui.edittask.EditTaskUiState
com.harrison.todotasks.ui.edittask.EditTaskUiState.*

// Immutable by design. Composables take today's date as a parameter.
java.time.LocalDate
